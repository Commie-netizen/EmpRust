name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-and-web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest cryptography httpx pydantic

      - name: Run Python tests
        run: |
          pytest -q

      - name: Run Web tests
        run: |
          node --test tests/web_session.test.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Run Rust tests
        run: |
          cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Build examples
        run: |
          cargo build --manifest-path rust/Cargo.toml --examples

  interop:
    needs: [python-and-web, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install -e .
          pip install cryptography httpx pydantic

      - name: Build Rust interop example
        run: |
          cargo build --manifest-path rust/Cargo.toml --examples

      - name: Run Python <-> Rust interop tests
        run: |
          python tools/test_rust_interop.py --driver rust/target/debug/examples/interop

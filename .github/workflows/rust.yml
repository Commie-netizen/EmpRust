name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked --all-targets
      - run: cargo build --manifest-path rust/Cargo.toml --locked --release
      - run: python3 tools/test_memory_cli.py rust/target/release/empreinte

[project]
name = "empreinte"
version = "0.1.0"
description = "Personal encrypted archive with a tamper-evident provenance ledger, a graph view and selective licensing"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=49",  # x509.verification.ExtensionPolicy, and the path-building fix
    "certifi",  # default trust roots for the timestamp authority
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
empreinte = "empreinte.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empreinte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
